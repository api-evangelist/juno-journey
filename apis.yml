aid: juno-journey
name: Juno Journey
description: >-
  Juno Journey is an AI-powered Learning & Development (L&D) platform that unifies
  employee training, personalized development planning, skills analytics, and
  performance management into a single "HumAIn Workforce Platform." Its Juno Agents
  automate course authoring, build adaptive personal development plans, deliver
  real-time in-context knowledge assistance, and surface live capability analytics,
  while a built-in LMS aggregates 150+ external content providers. The product
  connects to HRIS, identity, messaging, calendar, and performance systems through
  pre-built integrations (Slack, Okta, Workday, BambooHR, HiBob, Personio,
  Cornerstone, Google Drive, Microsoft Azure). Juno Journey is a portfolio company
  of Insight Partners. As of this profile it publishes a marketing site, pricing,
  a knowledge hub, a blog, a status page, and a public trust center (ISO/IEC 27001,
  GDPR, CCPA) but exposes no public developer API, OpenAPI, or developer portal.
